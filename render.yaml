services:
  - type: web
    name: iditz-perfume
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: iditz-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/noore.db
      - key: UPLOADS_PATH
        value: /data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "*"
      - key: PAYMENT_GATEWAY_PROVIDER
        value: razorpay
      - key: PAYMENT_GATEWAY_KEY_ID
        sync: false
      - key: PAYMENT_GATEWAY_KEY_SECRET
        sync: false
      - key: PAYMENT_GATEWAY_WEBHOOK_SECRET
        sync: false
