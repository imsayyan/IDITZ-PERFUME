<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDITZ PERFUME — Local Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0c0b0a;
      color: #f7f4ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #141210;
      border: 1px solid rgba(212, 175, 55, 0.45);
      box-shadow: 0 20px 45px rgba(0,0,0,0.7);
      border-radius: 8px;
      padding: 2.5rem 2rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .brand {
      color: #d4af37;
      letter-spacing: 0.25em;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 1.6rem;
      color: #ffffff;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    p {
      font-size: 0.9rem;
      color: #c5beb4;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .status-connecting {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: #d4af37;
    }
    .status-offline {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }
    .status-online {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #d4af37;
      color: #0c0b0a;
      font-weight: 700;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 0.85rem 1.5rem;
      border-radius: 4px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background: #e5c358;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }
    .instruction-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
      font-size: 0.85rem;
    }
    .step {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .step:last-child {
      margin-bottom: 0;
    }
    .step-num {
      color: #d4af37;
      font-weight: 700;
    }
    code {
      background: rgba(212, 175, 55, 0.15);
      color: #f1dfa8;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">IDITZ PERFUME</div>
    <h1 id="title">Connecting to Boutique...</h1>

    <div id="statusBadge" class="status-badge status-connecting">
      <div class="spinner" id="spinner"></div>
      <span id="statusText">Checking server status...</span>
    </div>

    <p id="description">
      Checking connection to your local store on <code>localhost:5173</code>.
    </p>

    <div id="instructionBox" class="instruction-box" style="display: none;">
      <div class="step">
        <span class="step-num">1.</span>
        <span>Go to this project folder: <code>Perfume 19</code></span>
      </div>
      <div class="step">
        <span class="step-num">2.</span>
        <span>Double-click <code>start-website.bat</code> to start the server.</span>
      </div>
      <div class="step">
        <span class="step-num">3.</span>
        <span>This page will automatically connect as soon as the server is ready!</span>
      </div>
    </div>

    <button id="actionBtn" class="btn" onclick="checkAndRedirect()">
      Opening Store...
    </button>
  </div>

  <script>
    const targetUrl = 'http://localhost:5173';
    let attempts = 0;

    async function checkServer() {
      try {
        const response = await fetch(targetUrl, { mode: 'no-cors', cache: 'no-store' });
        return true;
      } catch (err) {
        return false;
      }
    }

    async function checkAndRedirect() {
      const isUp = await checkServer();
      const badge = document.getElementById('statusBadge');
      const spinner = document.getElementById('spinner');
      const text = document.getElementById('statusText');
      const title = document.getElementById('title');
      const desc = document.getElementById('description');
      const instruction = document.getElementById('instructionBox');
      const btn = document.getElementById('actionBtn');

      if (isUp) {
        badge.className = 'status-badge status-online';
        if (spinner) spinner.style.display = 'none';
        text.innerText = 'Connected! Opening...';
        title.innerText = 'Store Online';
        desc.innerText = 'Redirecting to your IDITZ PERFUME boutique...';
        btn.innerText = 'Go to Store Now';
        window.location.href = targetUrl;
      } else {
        badge.className = 'status-badge status-offline';
        if (spinner) spinner.style.display = 'none';
        text.innerText = 'Server Offline';
        title.innerText = 'Server Not Running Yet';
        desc.innerText = 'The local Node.js server is currently stopped, which causes Chrome to show "connection refused".';
        instruction.style.display = 'block';
        btn.innerText = 'Retry Connection';
      }
    }

    // Initial check
    checkAndRedirect();

    // Periodic check every 2.5 seconds
    setInterval(async () => {
      const isUp = await checkServer();
      if (isUp) {
        window.location.href = targetUrl;
      }
    }, 2500);
  </script>
</body>
</html>
